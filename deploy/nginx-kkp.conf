upstream kkp_django {
    server 127.0.0.1:8001;
    keepalive 16;
}

server {
    listen 443 ssl;
    server_name investasi.kkp.go.id;

    ssl_certificate /etc/ssl/kkp/fullchain.pem;
    ssl_certificate_key /etc/ssl/kkp/privkey.pem;
    ssl_protocols TLSv1.3;
    ssl_session_cache shared:kkp_ssl:10m;
    ssl_session_timeout 1d;

    root /home/deploy/kkp/Frontend/dist;
    index index.html;
    client_max_body_size 50m;
    add_header X-Robots-Tag "noindex, nofollow" always;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types application/json application/geo+json application/javascript text/css text/plain image/svg+xml;

    location /assets/ {
        include snippets/kkp-keamanan.conf;
        add_header Cache-Control "public, immutable";
        expires 1y;
        try_files $uri =404;
    }

    location /static/ {
        alias /home/deploy/kkp/Backend/staticfiles/;
        expires 7d;
    }

    include snippets/kkp-asisten.conf;

    location ~ ^/(api|o)/ {
        proxy_pass http://kkp_django;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        include snippets/kkp-keamanan.conf;
        try_files $uri /index.html;
    }
}

server {
    listen 80;
    server_name investasi.kkp.go.id;
    return 301 https://$host$request_uri;
}
