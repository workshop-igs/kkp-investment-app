location = /ows {
    if ($args = "") { return 302 /ows?SERVICE=WMS&REQUEST=GetCapabilities; }
    include snippets/kkp-keamanan.conf;
    add_header Access-Control-Allow-Origin "*" always;
    limit_except GET POST { deny all; }
    gzip on;
    gzip_types text/xml application/xml application/json application/geo+json application/vnd.ogc.gml;
    fastcgi_pass unix:/run/fcgiwrap.socket;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /usr/lib/cgi-bin/mapserv;
    fastcgi_read_timeout 120s;
}
