<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo-kkp.png" />
    <link rel="preload" href="/logo-kkp.png" as="image" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Sistem Manajemen Investasi Ruang Laut — Kementerian Kelautan dan Perikanan" />
    <title>Manajemen Investasi KKP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <style>
      .pembuka { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 24px; background: radial-gradient(circle at 30% 20%, #0e2647, #002242); font-family: 'Public Sans', ui-sans-serif, system-ui, sans-serif; }
      .pembuka-kartu { width: 100%; max-width: 320px; box-sizing: border-box; padding: 28px; border-radius: 16px; background: #fff; text-align: center; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, .35); }
      .pembuka-cincin { position: relative; width: 80px; height: 80px; margin: 0 auto; }
      .pembuka-cincin i { position: absolute; inset: 0; border-radius: 50%; background: conic-gradient(from 0deg, rgba(64,191,219,0) 0 30%, #40BFDB 65%, #0056A5 100%); -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3.5px)); mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3.5px)); animation: pembuka-putar 1.1s linear infinite; }
      .pembuka-cincin span { position: absolute; inset: 7px; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: rgba(231, 239, 250, .6); }
      .pembuka-cincin img { width: 44px; height: 44px; object-fit: contain; }
      .pembuka-judul { margin: 20px 0 0; font-size: 15px; font-weight: 700; color: #002242; }
      .pembuka-ket { margin: 6px 0 0; font-size: 12px; line-height: 1.6; color: #64748b; }
      .pembuka-bar { height: 4px; margin-top: 20px; overflow: hidden; border-radius: 9999px; background: #e7effa; }
      .pembuka-bar i { display: block; width: 40%; height: 100%; border-radius: 9999px; background: linear-gradient(to right, #0056A5, #40BFDB); animation: pembuka-geser 1.3s ease-in-out infinite; }
      @keyframes pembuka-putar { to { transform: rotate(360deg); } }
      @keyframes pembuka-geser { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) { .pembuka-cincin i, .pembuka-bar i { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="pembuka" role="status" aria-live="polite">
        <div class="pembuka-kartu">
          <div class="pembuka-cincin"><i></i><span><img src="/logo-kkp.png" alt="" /></span></div>
          <p class="pembuka-judul">Memuat aplikasi</p>
          <p class="pembuka-ket">Sistem Manajemen Investasi Ruang Laut</p>
          <div class="pembuka-bar"><i></i></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
