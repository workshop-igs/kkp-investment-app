<!DOCTYPE html>

    <style>
      .pembuka { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px; background: #fff; font-family: 'Public Sans', ui-sans-serif, system-ui, sans-serif; }
      .pembuka-tanda { width: 300px; max-width: 100%; }
      .pembuka-ket { margin: 0; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: #0056A5; }
      .lm-ombak { animation: lm-ombak 3.2s linear infinite; }
      .lm-ombak-b { animation: lm-ombak 5s linear infinite reverse; }
      .lm-pasang { animation: lm-pasang 4s ease-in-out infinite; }
      .lm-ikan { animation: lm-ikan 7s linear infinite; }
      .lm-ikan-b { animation: lm-ikan 9.5s linear -4s infinite; }
      .lm-ikan-c { animation: lm-ikan 12s linear -9s infinite; }
      .lm-gelembung { animation: lm-gelembung 2.6s ease-in infinite; }
      .lm-rumput { transform-box: fill-box; transform-origin: 50% 100%; animation: lm-rumput 2.8s ease-in-out infinite alternate; }
      .lm-diam * { animation-play-state: paused !important; }
      @keyframes lm-ombak { to { transform: translateX(-160px); } }
      @keyframes lm-pasang { 0%, 100% { transform: translateY(5px); } 50% { transform: translateY(-7px); } }
      @keyframes lm-ikan { from { transform: translateX(-40px); } to { transform: translateX(520px); } }
      @keyframes lm-gelembung { 0% { transform: translateY(0); opacity: 0; } 20% { opacity: .9; } 100% { transform: translateY(-36px); opacity: 0; } }
      @keyframes lm-rumput { from { transform: rotate(-8deg); } to { transform: rotate(8deg); } }
      @media (prefers-reduced-motion: reduce) {
        .lm-ombak { animation-duration: 8s; } .lm-ombak-b { animation-duration: 12s; } .lm-pasang { animation-duration: 10s; }
        .lm-ikan { animation-duration: 17s; } .lm-ikan-b { animation-duration: 23s; } .lm-ikan-c { animation-duration: 29s; }
        .lm-gelembung { animation-duration: 6.5s; } .lm-rumput { animation-duration: 7s; }
      }
    </style>
  </head>
